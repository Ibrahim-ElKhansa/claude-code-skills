<style>
/* Layout: a full-bleed node canvas under a compact header; a step opens as a three-pane sheet
   (Input | Parameters | Output), one pane with tabs on phones; a walkthrough dock sits bottom left. */
:root {
  --bg: #e9edf2; --surface: #ffffff; --surface-2: #f4f6f9; --line: #cfd6df; --dot: #b9c2cd;
  --fg: #16202c; --muted: #586677; --accent: #2f55d4; --accent-soft: #e3e9fb;

  --c-kw: #7c3aed; --c-str: #0f7a3c; --c-num: #b45309; --c-com: #6b7a8c; --c-fn: #1d4ed8; --c-type: #0e7490; --c-attr: #9d174d;

  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --tile: 88px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --surface: #1a2028; --surface-2: #212833; --line: #333d4a; --dot: #2a323d;
  --fg: #e5eaf0; --muted: #98a5b5; --accent: #8199ff; --accent-soft: #232c4a;
  --ok: #42c97c; --ok-soft: #173326; --err: #ff7272; --err-soft: #3a1d1f; --warn: #f0b443;
  --sticky: #3b3520; --sticky-line: #5e542f; --sticky-fg: #f3e7b9; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  --t-trigger: #f39a52; --t-action: #6f9bff; --t-decision: #ab8dfb; --t-loop: #34cfbf; --t-merge: #9fb0c4;
  --t-data: #4ab8f0; --t-external: #a3b1c2; --t-ai: #f07ab9; --t-wait: #f2bd4c; --t-subflow: #8e8cff; --t-end: #a1a8b3;
  --c-kw: #c4a5ff; --c-str: #7ddc9f; --c-num: #f6b86b; --c-com: #7f8ea0; --c-fn: #8fb4ff; --c-type: #67d4e6; --c-attr: #f59bc3;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2028; --surface-2: #212833; --line: #333d4a; --dot: #2a323d;
  --fg: #e5eaf0; --muted: #98a5b5; --accent: #8199ff; --accent-soft: #232c4a;
  --ok: #42c97c; --ok-soft: #173326; --err: #ff7272; --err-soft: #3a1d1f; --warn: #f0b443;
  --sticky: #3b3520; --sticky-line: #5e542f; --sticky-fg: #f3e7b9; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  --t-trigger: #f39a52; --t-action: #6f9bff; --t-decision: #ab8dfb; --t-loop: #34cfbf; --t-merge: #9fb0c4;
  --t-data: #4ab8f0; --t-external: #a3b1c2; --t-ai: #f07ab9; --t-wait: #f2bd4c; --t-subflow: #8e8cff; --t-end: #a1a8b3;
  --c-kw: #c4a5ff; --c-str: #7ddc9f; --c-num: #f6b86b; --c-com: #7f8ea0; --c-fn: #8fb4ff; --c-type: #67d4e6; --c-attr: #f59bc3;

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--f-mono); }

#app { height: 100%; display: flex; flex-direction: column; }
#top { flex: none; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-start; justify-content: space-between;
  padding-block: 14px 12px; padding-inline: 20px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5; }
.top-text { flex: 1 1 520px; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.eyebrow b { color: var(--fg); font-weight: 600; }

.summary { margin: 0; max-width: 78ch; color: var(--muted); }
.takeaway { margin: 8px 0 0; max-width: 78ch; padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); font-weight: 500; }
.takeaway::before { content: "Takeaway  "; font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#crumbs { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 20px; font-size: 13px;
  background: var(--surface-2); border-bottom: 1px solid var(--line); }
#crumbs button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
#crumbs .here { font-weight: 600; }
#crumbs .sep { color: var(--muted); }

#stage { position: relative; flex: 1; min-height: 0; }
#viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.4px); }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--muted); stroke-width: 2; opacity: .75; }
.edge.error { stroke: var(--err); }
.edge.async { stroke-dasharray: 6 5; }
.edge.done { stroke: var(--ok); opacity: 1; stroke-width: 3; }
.edge.hot { stroke: var(--accent); opacity: 1; }
.edge-label { font: 500 11px var(--f-body); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.edge-label.hidden { display: none; }
.items { font: 600 11px var(--f-body); fill: var(--ok); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
#arrow path { fill: var(--muted); }
#arrow-ok path { fill: var(--ok); }
#arrow-err path { fill: var(--err); }

.node { position: absolute; width: var(--tile); }
.tile { position: relative; display: grid; place-items: center; width: var(--tile); border-radius: 14px; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); color: var(--tc); padding: 0; }
.tile .ic { width: 34px; height: 34px; stroke-width: 1.7; }
.tile:hover { border-color: var(--tc); }
.node.trigger .tile { border-radius: 44px 14px 14px 44px; }
.node.end .tile { border-radius: 14px 44px 44px 14px; }
.badge { position: absolute; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--surface); }
.badge .ic { width: 13px; height: 13px; stroke-width: 2.6; }
.bolt { left: -9px; top: -9px; background: var(--t-trigger); }
.node .check { right: -9px; top: -9px; background: var(--ok); display: none; }
.node.run-done .check { display: grid; }
.node.run-done .tile { border-color: var(--ok); }
.node.run-active .tile { border-color: var(--ok); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--ok-soft); } }
.node.sel .tile { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.node.assumed .tile { border-style: dashed; }
.node.disabled { opacity: .45; filter: grayscale(1); }
.open-sub { position: absolute; right: -9px; bottom: -9px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--t-subflow); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.open-sub .ic { width: 14px; height: 14px; }
.port { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); transform: translate(-50%, -50%); }
.port.err { border-color: var(--err); }
.port-label { position: absolute; transform: translateY(-118%); font: 500 10.5px/1 var(--f-body); color: var(--muted); white-space: nowrap; pointer-events: none; }
.port-label.err { color: var(--err); }
.label { position: absolute; left: 50%; width: 170px; margin-left: -85px; text-align: center; line-height: 1.25; pointer-events: none; }
.label b { display: block; font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.label small { display: block; color: var(--muted); font: 11px var(--f-mono); overflow-wrap: anywhere; }
.label .chip { margin-top: 3px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font: 600 10px/1.6 var(--f-body); letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid currentColor; }
.chip.assumed { color: var(--warn); }
.chip.off { color: var(--muted); }
.sticky { position: absolute; padding: 10px 12px; border-radius: 6px; background: var(--sticky); color: var(--sticky-fg);
  border: 1px solid var(--sticky-line); font-size: 13px; line-height: 1.45; overflow: auto; }
.sticky.blue { --sticky: #dde9ff; --sticky-line: #a9c2f2; --sticky-fg: #1b2f57; }
.sticky.green { --sticky: #dcf4e3; --sticky-line: #a2d8b4; --sticky-fg: #173b24; }
.sticky.pink { --sticky: #fbe1ee; --sticky-line: #eab0cc; --sticky-fg: #561b3a; }
.sticky.grey { --sticky: #eceff3; --sticky-line: #c8cfd8; --sticky-fg: #2a3340; }
:root[data-theme="dark"] .sticky.blue, :root[data-theme="dark"] .sticky.green, :root[data-theme="dark"] .sticky.pink, :root[data-theme="dark"] .sticky.grey { --sticky: #252c38; --sticky-line: #3b4656; --sticky-fg: #dfe6ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sticky.blue, :root:not([data-theme="light"]) .sticky.green,
  :root:not([data-theme="light"]) .sticky.pink, :root:not([data-theme="light"]) .sticky.grey { --sticky: #252c38; --sticky-line: #3b4656; --sticky-fg: #dfe6ef; } }

.t-trigger { --tc: var(--t-trigger); } .t-action { --tc: var(--t-action); } .t-decision { --tc: var(--t-decision); }
.t-loop { --tc: var(--t-loop); } .t-merge { --tc: var(--t-merge); } .t-data { --tc: var(--t-data); } .t-external { --tc: var(--t-external); }
.t-ai { --tc: var(--t-ai); } .t-wait { --tc: var(--t-wait); } .t-subflow { --tc: var(--t-subflow); } .t-end { --tc: var(--t-end); }

.zoombar { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.zoombar .btn { padding: 6px; justify-content: center; }

#dock { position: absolute; left: 14px; bottom: 14px; width: min(400px, calc(100% - 28px)); max-height: min(46%, 380px); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 4; }
.dock-tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.dock-tabs button { flex: 1; border: 0; background: none; padding: 8px 10px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.dock-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.dock-tabs .min { flex: none; padding-inline: 12px; }
.dock-body { padding: 12px 14px; overflow: auto; min-height: 0; }
#dock.collapsed .dock-body { display: none; }
.step-count { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.dock-body h3 { margin: 2px 0 6px; font: 600 16px/1.3 var(--f-display); }
.dock-body p { margin: 0 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.runs li { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.runlog { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.runlog li button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; width: 100%; }
.runlog li button:focus-visible { outline: 2px solid var(--accent); }
.runlog .n { color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 1.6em; }
.runlog .note { color: var(--muted); }

#doc { flex: 1; min-height: 0; overflow: auto; padding-inline: 16px; padding-block: 24px 80px; }
#doc .wrap { max-width: 74ch; margin: 0 auto; }
#doc h2 { font: 700 22px/1.2 var(--f-display); margin: 36px 0 6px; text-wrap: balance; }
#doc h3 { font: 600 17px/1.3 var(--f-display); margin: 26px 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#doc .intro { color: var(--muted); }
#doc .tourtext { border-left: 3px solid var(--accent); padding-left: 12px; }
.typechip { color: var(--tc); }

#ndv { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; }
.ndv-backdrop { position: absolute; inset: 0; background: rgba(10,14,20,.45); }
.ndv-sheet { position: relative; width: min(1240px, calc(100% - 32px)); height: min(86%, 900px); display: flex; flex-direction: column;
  background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
.ndv-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ndv-head .ic.big { width: 26px; height: 26px; color: var(--tc); }
.ndv-title { flex: 1 1 260px; min-width: 0; }
.ndv-title h2 { margin: 0; font: 700 19px/1.2 var(--f-display); overflow-wrap: anywhere; }
.ndv-title small { color: var(--muted); font: 12px var(--f-mono); }
.ndv-tabs { display: none; flex: none; border-bottom: 1px solid var(--line); }
.ndv-tabs button { flex: 1; border: 0; background: none; padding: 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.ndv-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.ndv-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr) minmax(0, 1fr); }
.pane { min-width: 0; overflow: auto; padding: 14px 16px 24px; }
.pane.io { background: var(--surface-2); }
.pane.params { border-inline: 1px solid var(--line); }
.pane h3 { margin: 0 0 8px; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pane h4 { margin: 18px 0 6px; font: 600 15px/1.3 var(--f-display); }
.pane h4:first-of-type { margin-top: 4px; }
.pane p, .pane li { max-width: 70ch; }
.pane ol, .pane ul { padding-left: 1.3em; margin: 0; }
.pane li + li { margin-top: 4px; }
.flag { margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--warn); color: var(--fg); background: var(--surface-2); }
.flag.off { border-color: var(--muted); }
.n8n { padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); }
.pin { display: inline-flex; gap: 5px; align-items: center; font: 600 11px var(--f-body); letter-spacing: .04em; color: var(--warn); margin-bottom: 6px; }
.pin .ic { width: 13px; height: 13px; }
.muted { color: var(--muted); }
pre.json, figure.code pre { margin: 0; overflow: auto; font-size: 12.5px; line-height: 1.55; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
figure.code { margin: 10px 0 0; }
figure.code figcaption { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 4px; font-size: 12.5px; }
figure.code figcaption code { font-weight: 500; }
figure.code .warnline { color: var(--warn); }
figure.code pre { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; }
.gutter { color: var(--muted); text-align: right; user-select: none; font-variant-numeric: tabular-nums; }
.codecol { white-space: pre; min-width: 0; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-literal { color: var(--c-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--c-str); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--c-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--c-com); font-style: italic; }
.hljs-title, .hljs-section, .hljs-title.function_ { color: var(--c-fn); }
.hljs-type, .hljs-title.class_, .hljs-params { color: var(--c-type); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable, .hljs-property { color: var(--c-attr); }
.hljs-deletion { color: var(--err); }
a.term, a.nodelink { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
p code, li code, .sticky code, .dock-body code { font-size: .9em; padding: 0 4px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 15; background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -10px 0 40px rgba(0,0,0,.18); display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font: 700 18px var(--f-display); }
.drawer .body { overflow: auto; padding: 8px 16px 32px; }
.drawer dl { margin: 0; }
.drawer dt { margin-top: 16px; font-weight: 600; }
.drawer dd { margin: 2px 0 0; }
.drawer dd + dd { color: var(--muted); font-size: 13.5px; }
.drawer .flash { animation: flash 1.6s ease-out; border-radius: 6px; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.legend-grid { display: grid; gap: 10px; }
.legend-item { display: flex; gap: 10px; align-items: center; }
.legend-item .sw { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: var(--tc); background: var(--surface); flex: none; }
.legend-item .sw .ic { width: 17px; height: 17px; }
.legend-item svg.line { width: 40px; height: 12px; flex: none; }

#nodata { padding: 40px 20px; max-width: 60ch; }

@media (max-width: 760px) {
  #top { padding-inline: 16px; padding-block: 10px 8px; gap: 8px; }
  .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 { font-size: 19px; }
  .summary, .takeaway { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .summary.open, .takeaway.open { display: block; }
  .takeaway { margin-top: 6px; padding: 4px 8px; }
  .btn .txt { display: none; }
  #crumbs { padding-inline: 16px; }
  .ndv-sheet { width: 100%; height: 100%; border-radius: 0; }
  .ndv-tabs { display: flex; }
  .ndv-panes { display: block; overflow: hidden; }
  .pane { display: none; height: 100%; }
  .pane.on { display: block; }
  .pane.params { border: 0; }
  #dock { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 42%; }
}
@media (prefers-reduced-motion: reduce) {
  .node.run-active .tile, .drawer .flash { animation: none; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<!--HLJS_LANGS-->
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const icon = (name, cls) => { const s = svgEl("svg", { class: "ic" + (cls ? " " + cls : ""), "aria-hidden": "true" }); s.appendChild(svgEl("use", { href: "#i-" + name })); return s; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let FLOW;
try { FLOW = JSON.parse($("#flow-data").textContent); } catch (e) { FLOW = null; }
if (!FLOW || !FLOW.canvases) {
  document.body.innerHTML = '<div id="nodata"><h1>No flow data</h1><p>This page is the explain template. Build it with <code>build.py</code>, which puts a flow into it.</p></div>';
  return;
}

const COL_W = 230, LANE_H = 190, PAD = 40, TILE = 88;
const TYPE_ICON = { trigger: "zap", action: "play", decision: "git-branch", loop: "repeat", merge: "merge", data: "database",
  external: "globe", ai: "sparkles", wait: "clock", subflow: "layers", end: "flag" };
const TYPE_NAME = { trigger: "Trigger", action: "Action", decision: "Decision (IF / Switch)", loop: "Loop over items", merge: "Merge",
  data: "Data", external: "Outside service", ai: "AI step", wait: "Wait", subflow: "Sub-workflow", end: "End" };

const canvases = {}; const nodeCanvas = {}; const nodeById = {};
for (const c of FLOW.canvases) { canvases[c.id] = c; for (const n of c.nodes) { nodeCanvas[n.id] = c.id; nodeById[n.id] = n; } }
const terms = {}; for (const t of FLOW.glossary || []) terms[t.term.toLowerCase()] = t;

function inputsOf(n) { if (n.inputs) return n.inputs; if (n.type === "trigger") return []; if (n.type === "merge") return [{ id: "in1" }, { id: "in2" }]; return [{ id: "main" }]; }
function outputsOf(n) {
  let o = n.outputs ? n.outputs.slice() : n.type === "end" ? [] : n.type === "loop" ? [{ id: "done" }, { id: "loop" }] : [{ id: "main" }];
  if (n.errorOutput) o.push({ id: "error", label: "error", err: true });
  return o;
}
function tileH(n) { return Math.max(TILE, 22 * Math.max(outputsOf(n).length, inputsOf(n).length) + 16); }
function pos(n) { return { x: PAD + n.col * COL_W, y: PAD + n.lane * LANE_H }; }
function portXY(n, side, id) {
  const p = pos(n), h = tileH(n), list = side === "in" ? inputsOf(n) : outputsOf(n);
  let i = list.findIndex(q => q.id === id); if (i < 0) i = 0;
  return { x: side === "in" ? p.x : p.x + TILE, y: p.y + h * (i + 1) / (list.length + 1) };
}

/* ---------- markup: escape first, then a fixed set of marks ---------- */
function md(s) {
  if (!s) return "";
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[\[#([a-z][a-z0-9-]*)\]\]/g, (m, id) => nodeById[id] ? `<a class="nodelink" data-node="${id}" tabindex="0">${esc(nodeById[id].name)}</a>` : esc(id))
    .replace(/\[\[([^\]]+)\]\]/g, (m, t) => `<a class="term" data-term="${t.toLowerCase()}" tabindex="0">${t}</a>`)
    .replace(/\n/g, "<br>");
}

/* ---------- state ---------- */
const state = { stack: [], view: { x: 0, y: 0, k: 1 }, sel: null, tour: -1, mode: "canvas", dockTab: "tour", run: null, fitted: false };
const vp = $("#viewport"), world = $("#world");

function canvas() { return canvases[state.stack[state.stack.length - 1].id]; }

/* ---------- header ---------- */
function header() {
  $("#title").textContent = FLOW.title;
  $("#summary").innerHTML = md(FLOW.summary);
  $("#takeaway").innerHTML = md(FLOW.takeaway);
  const s = FLOW.source || {}, all = FLOW.canvases.flatMap(c => c.nodes), assumed = all.filter(n => n.assumed).length;
  const bits = [];
  if (s.repo) bits.push(`<b>${esc(s.repo)}</b>` + (s.branch ? ` · ${esc(s.branch)}` : "") + (s.commit ? `@${esc(s.commit)}` : "") + (s.dirty ? " (with uncommitted changes)" : ""));
  else bits.push("<b>Concept</b> · not tied to code");
  bits.push(`${all.length} steps on ${FLOW.canvases.length} canvas${FLOW.canvases.length > 1 ? "es" : ""}`);
  bits.push(assumed ? `${assumed} of ${all.length} assumed, not read in code` : "every step read in code");
  $("#eyebrow").innerHTML = bits.join("  ·  ");
  for (const id of ["#summary", "#takeaway"]) $(id).addEventListener("click", e => { if (!e.target.closest("a")) e.currentTarget.classList.toggle("open"); });
}

/* ---------- canvas drawing ---------- */
function draw() {
  const c = canvas();
  const nodesEl = $("#nodes"), edgeLayer = $("#edge-layer"), labelLayer = $("#label-layer"), stickiesEl = $("#stickies");
  nodesEl.textContent = ""; edgeLayer.textContent = ""; labelLayer.textContent = ""; stickiesEl.textContent = "";

  for (const s of c.stickies || []) {
    const d = el("div", "sticky" + (s.color && s.color !== "yellow" ? " " + s.color : ""));
    d.style.left = PAD + s.col * COL_W + "px"; d.style.top = PAD + s.lane * LANE_H + "px";
    d.style.width = Math.max(140, s.w * COL_W - 20) + "px"; d.style.height = Math.max(60, s.h * LANE_H - 20) + "px";
    d.innerHTML = md(s.text); stickiesEl.appendChild(d);
  }

  let backN = 0;
  for (const [i, e] of (c.edges || []).entries()) {
    const a = nodeById[e.from], b = nodeById[e.to]; if (!a || !b) continue;
    const p1 = portXY(a, "out", e.out || outputsOf(a)[0]?.id || "main"), p2 = portXY(b, "in", e.in || inputsOf(b)[0]?.id || "main");
    let d;
    if (a === b) {
      const top = pos(a).y - 50;
      d = `M${p1.x} ${p1.y} C${p1.x + 60} ${p1.y} ${p1.x + 60} ${top} ${(p1.x + p2.x) / 2} ${top} S${p2.x - 60} ${p2.y} ${p2.x} ${p2.y}`;
    } else if (p2.x <= p1.x + 20) {
      const lo = Math.min(a.col, b.col), hi = Math.max(a.col, b.col);
      const yb = Math.max(...c.nodes.filter(n => n.col >= lo && n.col <= hi).map(n => pos(n).y + tileH(n))) + 70 + 22 * backN++;
      d = `M${p1.x} ${p1.y} h30 q16 0 16 16 V${yb - 16} q0 16 -16 16 H${p2.x - 34} q-16 0 -16 -16 V${p2.y + 16} q0 -16 16 -16 h${18 - 6}`;
    } else {
      const skip = c.nodes.some(n => n !== a && n !== b && n.col > a.col && n.col < b.col && Math.abs(n.lane - a.lane) < 0.75 && Math.abs(n.lane - b.lane) < 0.75);

      run.steps.slice(0, state.run.shown).forEach((s, i) => {
        const li = el("li"), b = el("button"); b.type = "button";
        b.appendChild(el("span", "n", String(i + 1)));
        const txt = el("span"); const nn = nodeById[s.node];
        txt.innerHTML = `<strong>${esc(nn.name)}</strong>` + (s.out && s.out !== "main" ? ` → ${esc(s.out)}` : "") + (s.items ? ` · ${s.items} item${s.items > 1 ? "s" : ""}` : "") + (s.note ? ` <span class="note">${md(s.note)}</span>` : "");
        b.appendChild(txt); b.onclick = () => { selectNode(s.node, true); panTo(nn); }; li.appendChild(b); log.appendChild(li);
      });
      body.appendChild(log);
      const clear = el("button", "btn"); clear.type = "button"; clear.textContent = "Clear run"; clear.style.marginTop = "10px";
      clear.onclick = () => { stopRun(); resetRunMarks(); highlight(); renderDock(); }; body.appendChild(clear);
    }
  }
}
function tourGo(i) {
  const c = canvas(), tour = c.tour || []; if (!tour.length) return;
  state.tour = Math.max(0, Math.min(tour.length - 1, i)); state.dockTab = "tour";
  const t = tour[state.tour];
  if (t.node) { selectNode(t.node, false); panTo(nodeById[t.node]); } else { state.sel = null; highlight(); fit(); }
  renderDock();
}
$("#tab-tour").onclick = () => { state.dockTab = "tour"; $("#dock").classList.remove("collapsed"); renderDock(); };
$("#tab-runs").onclick = () => { state.dockTab = "runs"; $("#dock").classList.remove("collapsed"); renderDock(); };
$("#dock-min").onclick = () => { const d = $("#dock"); d.classList.toggle("collapsed"); $("#dock-min").setAttribute("aria-label", d.classList.contains("collapsed") ? "Expand" : "Collapse"); };

function resetRunMarks() {
  document.querySelectorAll(".node").forEach(b => b.classList.remove("run-done", "run-active"));
  document.querySelectorAll("#edge-layer .edge").forEach(p => { p.classList.remove("done"); const k = p.classList.contains("error") ? "err" : ""; p.setAttribute("marker-end", k ? "url(#arrow-err)" : "url(#arrow)"); });
  document.querySelectorAll("#label-layer .items").forEach(t => t.remove());
}
function startRun(run) {
  stopRun(); resetRunMarks(); closeNdv();
  const c = canvas(); state.run = { id: run.id, timers: [], shown: 0 };
  const delay = reduced ? 0 : 750;
  run.steps.forEach((s, i) => {
    const fn = () => {
      if (!state.run || state.run.id !== run.id) return;
      state.run.shown = i + 1;
      document.querySelectorAll(".node.run-active").forEach(b => { b.classList.remove("run-active"); b.classList.add("run-done"); });
      const box = document.querySelector(`.node[data-id="${s.node}"]`);
      if (box) { box.classList.add(i === run.steps.length - 1 ? "run-done" : "run-active"); }
      for (let j = i - 1; j >= 0; j--) {
        const pj = run.steps[j], out = pj.out || "main";
        const ei = c.edges.findIndex(e => e.from === pj.node && (e.out || "main") === out && e.to === s.node);
        if (ei >= 0) { markEdge(ei, pj.items || s.items || 1); break; }
      }
      if (i === run.steps.length - 1) document.querySelectorAll(".node.run-active").forEach(b => { b.classList.remove("run-active"); b.classList.add("run-done"); });
      if (state.dockTab === "runs") renderDock();
      highlight();
    };
    if (delay) state.run.timers.push(setTimeout(fn, i * delay)); else fn();
  });
  state.dockTab = "runs"; renderDock();
}
function markEdge(i, items) {
  const p = document.querySelector(`#edge-layer .edge[data-edge="${i}"]`); if (!p) return;
  p.classList.add("done"); p.setAttribute("marker-end", "url(#arrow-ok)");
  const len = p.getTotalLength(), pt = p.getPointAtLength(len * 0.35);
  const t = svgEl("text", { x: pt.x, y: pt.y - 8, "text-anchor": "middle", class: "items" });
  t.textContent = `${items} item${items > 1 ? "s" : ""}`; $("#label-layer").appendChild(t);
}

/* ---------- document view ---------- */
function canvasOrder() {
  const out = [], seen = new Set();
  const visit = id => { if (seen.has(id) || !canvases[id]) return; seen.add(id); out.push(id);
    const c = canvases[id]; for (const nid of tourOrderOf(c)) { const n = nodeById[nid]; if (n.type === "subflow" && n.subflow) visit(n.subflow); } };
  visit(FLOW.entry); for (const c of FLOW.canvases) visit(c.id); return out;
}
function tourOrderOf(c) {
  const seen = new Set(), list = [];
  for (const t of c.tour || []) if (t.node && !seen.has(t.node)) { seen.add(t.node); list.push(t.node); }
  for (const n of c.nodes) if (!seen.has(n.id)) list.push(n.id);
  return list;
}
function renderDoc() {
  const w = $("#doc-wrap"); w.textContent = "";
  for (const cid of canvasOrder()) {
    const c = canvases[cid];
    const h2 = el("h2", null, c.title); h2.id = "doc-canvas-" + cid; w.appendChild(h2);
    const intro = el("p", "intro"); intro.innerHTML = md(c.intro); w.appendChild(intro);
    const tourText = {}; for (const t of c.tour || []) if (t.node && !tourText[t.node]) tourText[t.node] = t;
    for (const t of c.tour || []) if (!t.node) { const p = el("p", "tourtext"); p.innerHTML = `<strong>${esc(t.title)}.</strong> ` + md(t.text); w.appendChild(p); }
    tourOrderOf(c).forEach((nid, i) => {
      const n = nodeById[nid], h3 = el("h3", "t-" + n.type); h3.id = "doc-" + nid;
      h3.appendChild(el("span", null, `${i + 1}. ${n.name}`)); h3.appendChild(el("span", "chip typechip", TYPE_NAME[n.type]));
      if (n.assumed) h3.appendChild(el("span", "chip assumed", "assumed")); if (n.disabled) h3.appendChild(el("span", "chip off", "off"));
      w.appendChild(h3);
      const t = tourText[nid]; if (t) { const p = el("p", "tourtext"); p.innerHTML = md(t.text); w.appendChild(p); }
      const add = html => { const d = el("div"); d.innerHTML = html; w.appendChild(d); };
      if (n.assumed) add(`<p class="flag"><strong>Assumed, not read in code.</strong> ${md(n.assumed.why)}</p>`);
      if (n.disabled) add(`<p class="flag off"><strong>Off.</strong> ${md(n.disabled.why)}</p>`);
      add(`<p><strong>What it does.</strong> ${md(n.explain.what)}</p><p><strong>Why.</strong> ${md(n.explain.why)}</p>`);
      add("<ol>" + n.explain.how.map(s => `<li>${md(s)}</li>`).join("") + "</ol>");
      if (n.explain.n8n) add(`<p class="n8n"><strong>In n8n terms.</strong> ${md(n.explain.n8n)}</p>`);
      for (const cr of n.code || []) w.appendChild(codeFigure(cr));
      if (n.explain.gotchas && n.explain.gotchas.length) add("<p><strong>Watch out for</strong></p><ul>" + n.explain.gotchas.map(s => `<li>${md(s)}</li>`).join("") + "</ul>");
      if (n.type === "subflow" && n.subflow) add(`<p class="muted">Continues in the section <a class="nodelink" data-canvas="${n.subflow}" tabindex="0">${esc(canvases[n.subflow].title)}</a>.</p>`);
    });
  }
  if (FLOW.glossary && FLOW.glossary.length) {
    w.appendChild(el("h2", null, "Glossary")); const dl = el("dl");
    for (const t of FLOW.glossary) { dl.appendChild(el("dt", null, t.term)); const dd = el("dd"); dd.innerHTML = md(t.plain) + (t.example ? `<br><span class="muted">Example: ${md(t.example)}</span>` : "") + (t.n8n ? `<br><span class="muted">In n8n: ${md(t.n8n)}</span>` : ""); dl.appendChild(dd); }
    w.appendChild(dl);
  }
  if (FLOW.outOfScope && FLOW.outOfScope.length) { w.appendChild(el("h2", null, "Not covered here")); const ul = el("ul"); for (const s of FLOW.outOfScope) { const li = el("li"); li.innerHTML = md(s); ul.appendChild(li); } w.appendChild(ul); }
}
function setMode(m) {
  state.mode = m; $("#mode-canvas").setAttribute("aria-pressed", m === "canvas"); $("#mode-doc").setAttribute("aria-pressed", m === "doc");
  $("#stage").hidden = m !== "canvas"; $("#doc").hidden = m !== "doc"; $("#crumbs").hidden = m !== "canvas" || state.stack.length < 2;
  if (m === "doc") { closeNdv(); renderDoc(); }
  else if (!state.fitted) state.fitted = fit();
}
$("#mode-canvas").onclick = () => setMode("canvas"); $("#mode-doc").onclick = () => setMode("doc");

/* ---------- glossary and legend ---------- */
function renderGlossary() {
  const b = $("#glossary-body"); b.textContent = ""; const dl = el("dl");
  for (const t of FLOW.glossary || []) {
    const dt = el("dt", null, t.term); dt.id = "term-" + t.term.toLowerCase().replace(/[^a-z0-9]+/g, "-"); dl.appendChild(dt);
    const dd = el("dd"); dd.innerHTML = md(t.plain); dl.appendChild(dd);
    if (t.example) { const e = el("dd"); e.innerHTML = "Example: " + md(t.example); dl.appendChild(e); }
    if (t.n8n) { const e = el("dd"); e.innerHTML = "In n8n: " + md(t.n8n); dl.appendChild(e); }
  }
  if (!(FLOW.glossary || []).length) b.appendChild(el("p", "muted", "No terms on this page."));
  b.appendChild(dl);
}
function openDrawer(id) { ["glossary", "legend"].forEach(d => { $("#" + d).hidden = d !== id; }); $("#" + id).querySelector("[data-close]").focus(); }
function showTerm(t) {
  openDrawer("glossary");
  const dt = document.getElementById("term-" + t.replace(/[^a-z0-9]+/g, "-"));
  if (dt) { dt.scrollIntoView({ block: "center" }); dt.classList.remove("flash"); void dt.offsetWidth; dt.classList.add("flash"); }
}
function renderLegend() {
  const b = $("#legend-body"), g = el("div", "legend-grid");
  for (const [type, name] of Object.entries(TYPE_NAME)) {
    const it = el("div", "legend-item t-" + type), sw = el("span", "sw"); sw.appendChild(icon(TYPE_ICON[type])); it.append(sw, el("span", null, name)); g.appendChild(it);
  }
  const line = (cls, text) => { const it = el("div", "legend-item"), s = svgEl("svg", { class: "line", viewBox: "0 0 40 12" });
    s.appendChild(svgEl("path", { d: "M2 6 H38", class: "edge " + cls })); it.append(s, el("span", null, text)); g.appendChild(it); };
  line("main", "Data flows to the next step"); line("error", "Error output: what happens when the step fails"); line("async", "Runs on its own, the flow does not wait");
  line("done", "Ran in the example run you played");
  const a = el("div", "legend-item"), sw = el("span", "sw"); sw.style.borderStyle = "dashed"; a.append(sw, el("span", null, "Dashed border: assumed, not read in code")); g.appendChild(a);
  const off = el("div", "legend-item"), sw2 = el("span", "sw"); sw2.style.opacity = ".45"; off.append(sw2, el("span", null, "Greyed out: switched off or a dead path")); g.appendChild(off);
  b.appendChild(g);
  const p = el("p", "muted"); p.innerHTML = "Drag to move the canvas. Pinch, or hold Ctrl and scroll, to zoom. Keys: arrows step through the walkthrough, + and − zoom, 0 fits, Esc closes."; b.appendChild(p);
}
$("#open-glossary").onclick = () => openDrawer("glossary"); $("#open-legend").onclick = () => openDrawer("legend");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { $("#" + b.dataset.close).hidden = true; });

/* links inside rendered text */
document.addEventListener("click", e => {
  const t = e.target.closest("a.term"); if (t) { e.preventDefault(); showTerm(t.dataset.term); return; }
  const n = e.target.closest("a.nodelink");
  if (n) { e.preventDefault();
    if (n.dataset.canvas) { const h = document.getElementById("doc-canvas-" + n.dataset.canvas); if (h) h.scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); return; }
    closeNdv(); goToNode(n.dataset.node); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches && e.target.matches("a.term, a.nodelink")) { e.target.click(); return; }
  if (e.target.matches && e.target.matches("input, textarea, select")) return;
  if (e.key === "Escape") {
    if (!$("#ndv").hidden) closeNdv();
    else if (!$("#glossary").hidden || !$("#legend").hidden) { $("#glossary").hidden = true; $("#legend").hidden = true; }
    else if (state.stack.length > 1 && state.mode === "canvas") popTo(state.stack.length - 2);
    return;
  }
  if (!$("#ndv").hidden || state.mode !== "canvas") return;
  if (e.key === "+" || e.key === "=") centerZoom(1.2);
  else if (e.key === "-" || e.key === "_") centerZoom(1 / 1.2);
  else if (e.key === "0") fit();
  else if (e.key === "ArrowRight") tourGo(state.tour + 1);
  else if (e.key === "ArrowLeft") tourGo(state.tour - 1);
});

/* ---------- start ---------- */
header(); renderGlossary(); renderLegend();
state.stack = [{ id: FLOW.entry }];
draw(); renderDock();
requestAnimationFrame(() => { if (!state.fitted) state.fitted = fit(); });
})();
</script>
